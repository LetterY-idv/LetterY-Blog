name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-workers
    steps:
      - name: Checkout site
        uses: actions/checkout@v7

      - name: Checkout private content
        if: ${{ vars.PRIVATE_CONTENT_REPOSITORY != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.PRIVATE_CONTENT_REPOSITORY }}
          ref: ${{ vars.PRIVATE_CONTENT_REF || 'master' }}
          token: ${{ secrets.PRIVATE_CONTENT_TOKEN }}
          path: private-content

      - name: Merge private content
        if: ${{ vars.PRIVATE_CONTENT_REPOSITORY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          source_dir="private-content/${{ vars.PRIVATE_CONTENT_PATH || 'posts' }}"
          test -d "$source_dir"
          rsync -a "$source_dir/" src/content/posts/
        # 合并私有文章，但保留博客仓库中原有的公开文章

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check site
        run: pnpm astro check

      - name: Build for Cloudflare Workers
        run: pnpm run build
        env:
          CF_WORKERS: '1'

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
