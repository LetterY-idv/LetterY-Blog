name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v7

      - name: Checkout private content
        if: ${{ vars.PRIVATE_CONTENT_REPOSITORY != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.PRIVATE_CONTENT_REPOSITORY }}
          ref: ${{ vars.PRIVATE_CONTENT_REF || 'master' }}
          token: ${{ secrets.PRIVATE_CONTENT_TOKEN }}
          path: private-content

      - name: Merge private content
        if: ${{ vars.PRIVATE_CONTENT_REPOSITORY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          source_dir="private-content/${{ vars.PRIVATE_CONTENT_PATH || 'posts' }}"
          test -d "$source_dir"
          rsync -a --delete "$source_dir/" src/content/posts/

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check site
        run: pnpm astro check

      - name: Build site
        run: pnpm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist  # Astro默认构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
